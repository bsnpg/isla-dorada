<!doctype html>
<html lang="en">
<head>

<title>Isla Dorada — 8 Jobs to Clear His Name</title>

<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1730; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #eef1f5; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .hidden { display: none !important; }
  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .panel { background: rgba(10,16,24,0.72); border: 1px solid rgba(255,255,255,0.18); border-radius: 8px; padding: 8px 10px; }
  #top-right { position: absolute; top: 12px; right: 12px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  #money { font-size: 22px; font-weight: 800; color: #7be495; }
  #rep { font-size: 12px; font-weight: 700; color: #ffd34d; letter-spacing: 1px; }
  #radio-badge { font-size: 11px; font-weight: 700; color: #fff; background: #e5539e; border-radius: 4px; padding: 3px 7px; letter-spacing: 1px; }
  #clock { text-align: center; color: #ffd34d; }
  .clock-time { font-size: 17px; font-weight: 800; color: #fff; }
  .clock-label { font-size: 10px; letter-spacing: 2px; color: #ffd34d; }
  #wanted { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); font-size: 26px; letter-spacing: 4px; color: #ffd34d; text-shadow: 0 2px 6px #000; }
  #wanted span.off { color: rgba(255,255,255,0.25); }
  #mission-box { position: absolute; top: 52px; left: 50%; transform: translateX(-50%); text-align: center; }
  #mission-name { font-size: 17px; font-weight: 800; color: #fff; text-shadow: 0 2px 4px #000; }
  #mission-code { font-size: 11px; color: #ffd34d; letter-spacing: 1px; text-shadow: 0 1px 3px #000; }
  #mission-objective { font-size: 12px; color: #eef1f5; margin-top: 3px; text-shadow: 0 1px 3px #000; }
  #chase-timer { font-size: 15px; font-weight: 800; color: #ff5a3c; }
  #idpd { position: absolute; top: 255px; right: 12px; width: 190px; }

  .idpd-row { display: flex; justify-content: space-between; font-size: 12px; padding: 2px 0; }
  .idpd-dist { color: #9fd4f2; }
  #minimap-wrap { position: absolute; left: 12px; bottom: 12px; }
  #minimap { border: 2px solid rgba(255,255,255,0.5); border-radius: 6px; display: block; }
  #wheel { position: absolute; left: 178px; bottom: 12px; }
  #speed-box { position: absolute; right: 12px; bottom: 12px; text-align: right; }
  #speed { font-size: 34px; font-weight: 800; color: #fff; text-shadow: 0 2px 6px #000; }
  #vehicle-name { font-size: 13px; font-weight: 700; color: #ffd34d; letter-spacing: 1px; }
  #nitro-wrap { width: 150px; height: 8px; background: rgba(255,255,255,0.2); border-radius: 4px; margin-top: 4px; overflow: hidden; }
  #nitro-bar { height: 100%; width: 78%; background: linear-gradient(90deg, #3fa7d6, #7be495); }
  #health-wrap { width: 150px; height: 8px; background: rgba(255,255,255,0.2); border-radius: 4px; margin-top: 4px; overflow: hidden; }
  #health-bar { height: 100%; width: 100%; background: #7be495; }
  #health-label { font-size: 10px; letter-spacing: 2px; color: #9fd4f2; }
  #dialogue { position: absolute; bottom: 210px; left: 50%; transform: translateX(-50%); font-size: 15px; font-style: italic; color: #fff; text-shadow: 0 2px 4px #000; background: rgba(10,16,24,0.6); padding: 6px 14px; border-radius: 6px; }
  #notice { position: absolute; bottom: 260px; left: 50%; transform: translateX(-50%); font-size: 15px; font-weight: 700; color: #ffd34d; text-shadow: 0 2px 4px #000; opacity: 0; transition: opacity 0.2s; }
  #notice.show { opacity: 1; }
  #prompt { position: absolute; bottom: 300px; left: 50%; transform: translateX(-50%); font-size: 15px; font-weight: 700; color: #fff; background: rgba(10,16,24,0.75); padding: 6px 14px; border-radius: 6px; }
  #mission-passed { position: absolute; top: 130px; left: 50%; transform: translateX(-50%); text-align: center; opacity: 0; transition: opacity 0.25s; }
  #mission-passed.show { opacity: 1; }
  .mp-title { font-size: 34px; font-weight: 900; letter-spacing: 4px; color: #ffd34d; text-shadow: 0 3px 8px #000; }
  .mp-name { font-size: 16px; color: #fff; }
  .mp-pay { font-size: 20px; font-weight: 800; color: #7be495; }
  #damage-big { position: absolute; top: 55%; right: 20%; font-size: 64px; font-weight: 900; color: #ff5a3c; text-shadow: 0 3px 10px #000; }
  /* ---------- Title ---------- */
  #title-screen { position: fixed; inset: 0; z-index: 10; background: linear-gradient(rgba(10,16,24,0.62), rgba(10,16,24,0.28) 55%, rgba(10,16,24,0.05)); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; }
  .title-inner { text-align: center; padding: 26px 16px 12px; max-width: 1080px; }
  .title-kicker { font-size: 12px; letter-spacing: 5px; color: #ffd34d; }
  .title-big { font-size: 84px; line-height: 0.92; margin: 6px 0 4px; font-weight: 900; letter-spacing: 6px; color: #fff; text-shadow: 0 4px 0 #e5539e, 0 8px 24px rgba(0,0,0,0.6); }
  .title-sub { font-size: 19px; letter-spacing: 4px; color: #ffd34d; font-weight: 700; }
  .title-portraits { display: flex; gap: 10px; justify-content: center; margin: 18px 0 12px; flex-wrap: wrap; }
  .portrait { width: 150px; box-sizing: border-box; background: rgba(10,16,24,0.78); border: 1px solid rgba(255,255,255,0.25); border-radius: 8px; padding: 8px; }
  .portrait-face { width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 6px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 900; color: #fff; }
  .portrait-name { font-size: 14px; font-weight: 800; }
  .portrait-role { font-size: 10px; color: #9fd4f2; }
  .portrait-line { font-size: 10px; font-style: italic; color: #ddd; margin-top: 4px; }
  .title-continue { font-size: 16px; font-weight: 800; color: #7be495; letter-spacing: 1px; }
  .title-buttons { margin: 12px 0 8px; display: flex; gap: 10px; justify-content: center; }
  .title-btn { pointer-events: auto; cursor: pointer; font-size: 16px; font-weight: 800; letter-spacing: 2px; padding: 10px 26px; border-radius: 6px; border: 1px solid #fff; background: rgba(10,16,24,0.7); color: #fff; }
  .title-btn.primary { background: #f2a541; color: #1c1c1c; border-color: #f2a541; }
  .title-hint { font-size: 12px; color: #cfe3f2; }
  .title-story { font-size: 12px; color: #ddd; max-width: 720px; margin: 8px auto 0; line-height: 1.5; }
  /* ---------- Map ---------- */
  #map-screen { position: fixed; inset: 0; z-index: 12; background: #101c2e; overflow-y: auto; padding: 8px 20px; }
  .map-head { display: flex; justify-content: space-between; align-items: baseline; }
  .map-head h2 { margin: 0; font-size: 20px; letter-spacing: 2px; }
  .map-close { font-size: 12px; color: #ffd34d; }
  .map-grid { display: grid; grid-template-columns: 300px 1fr 340px; gap: 12px; margin-top: 8px; }
  .map-col h3 { font-size: 11px; letter-spacing: 2px; color: #ffd34d; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 2px; margin: 5px 0 4px; }
  .map-district { font-size: 13px; padding: 3px 0; }
  .map-district i { color: #9fb3c8; font-size: 11px; margin-left: 6px; }
  .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .map-chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .map-chip { font-size: 11px; border: 1px solid #fff; border-radius: 10px; padding: 2px 8px; }
  .map-legend { font-size: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .map-job { display: grid; grid-template-columns: 22px 1fr auto auto; gap: 6px; font-size: 12px; padding: 1px 6px; border-radius: 4px; align-items: center; }
  .map-job.done { color: #7be495; }
  .map-job.current { background: rgba(242,201,76,0.18); border: 1px solid #f2c94c; }
  .map-job-num { font-weight: 800; color: #ffd34d; }
  .map-job-name i { color: #9fb3c8; }
  .map-job-pay { color: #7be495; font-weight: 700; }
  .map-job-state { font-size: 10px; letter-spacing: 1px; }
  .map-skill, .map-prop, .map-garage-row, .map-save { font-size: 11px; padding: 2px 0; display: flex; gap: 8px; align-items: center; }
  .skill-bar { flex: 1; height: 6px; background: rgba(255,255,255,0.15); border-radius: 4px; overflow: hidden; }
  .skill-bar i { display: block; height: 100%; background: #f2c94c; }
  .map-diagram { position: relative; height: 168px; border: 1px solid rgba(255,255,255,0.3); border-radius: 8px; background: #0a1420; overflow: hidden; }
  .dblock { position: absolute; border-radius: 6px; padding: 8px; color: #101c2e; }
  .dblock b { display: block; font-size: 13px; letter-spacing: 1px; }
  .dblock i { font-size: 10px; }
  .droad { position: absolute; left: 30%; top: 60%; width: 40%; height: 4%; background: #3a3f47; border-top: 2px dashed #f2c94c; border-bottom: 2px dashed #f2c94c; }
  .droad-label { position: absolute; left: 8%; top: -26px; font-size: 12px; font-weight: 800; letter-spacing: 2px; color: #c9a6ff; background: rgba(10,16,24,0.85); padding: 1px 6px; border-radius: 4px; }
  .droad-toll { position: absolute; right: 4%; top: -26px; font-size: 11px; color: #ffd34d; background: rgba(10,16,24,0.85); padding: 1px 6px; border-radius: 4px; }
  .dmarker { position: absolute; font-size: 11px; font-weight: 800; color: #fff; background: rgba(10,16,24,0.8); padding: 2px 6px; border-radius: 4px; }
  .dmarker.red { color: #ff8a7a; }
  .map-idols { font-size: 18px; letter-spacing: 2px; }
  .idol { color: rgba(255,255,255,0.25); }
  .idol.found { color: #ffd34d; }
  .map-ring-wrap { display: flex; justify-content: center; }
  /* ---------- Pause ---------- */
  #pause-screen { position: fixed; inset: 0; z-index: 11; background: rgba(10,16,24,0.8); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  #pause-screen h2 { font-size: 40px; letter-spacing: 6px; margin: 0; }
  .pause-btn { cursor: pointer; font-size: 15px; font-weight: 800; padding: 10px 26px; border-radius: 6px; border: 1px solid #fff; background: #f2a541; color: #1c1c1c; }
</style>
